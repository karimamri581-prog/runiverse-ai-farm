name: Living Gamer AI
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  farm:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write # Allows the bot to save memory back to the repo
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run Living Agent
        run: python living_agent.py "https://runiverseidle.com/forge" --max-minutes 300
      - name: Save Agent Memory
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add agent_memory.json || echo "No memory file yet"
          git commit -m "Save Living Agent Memory" || echo "No changes to commit"
          git push
