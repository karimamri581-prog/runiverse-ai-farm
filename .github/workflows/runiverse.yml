name: Runiverse God Agent
on:
  schedule:
    - cron: "0 * * * *" # Runs every hour automatically
  workflow_dispatch:

jobs:
  farm:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # Runs for 5.5 hours straight
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          pip install playwright requests google-genai
          python -m playwright install --with-deps chromium
      - name: Run God Agent
        run: python runiverse_bot.py
        env:
          BEARER_TOKEN: ${{ secrets.BEARER_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Save Agent Memory
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add agent_memory.json || echo "No memory file yet"
          git commit -m "Save Agent Memory" || echo "No changes to commit"
          git push
